<!--
  Sidebar UI for the CodeCogs Equation Editor Docs/Slides add-on.

  Runs inside Apps Script's HtmlService sandbox (IFRAME mode, the modern default), which is an
  ordinary iframe with a google.script.run bridge injected - external <script>/<link> tags load
  normally, the same as any other page, which is what lets this embed the same EqEditor UI
  every other adapter in this repo does rather than a cut-down textarea.
-->
<!DOCTYPE html>
<html>
<head>
    <base target="_top">
    <meta charset="utf-8">
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 12px; color: #1c2530; }
        #status { min-height: 18px; font-size: 12px; color: #b3261e; margin: 8px 0; }
        #status.ok { color: #2c7a4b; }
        .cc-actions { display: flex; gap: 8px; margin-top: 10px; }
        .cc-actions button {
            flex: 1; padding: 8px 12px; border-radius: 4px; border: 1px solid #cbd5e0;
            background: #fff; cursor: pointer; font-size: 13px;
        }
        #insert-btn { background: #2c7a4b; border-color: #2c7a4b; color: #fff; }
        #insert-btn:disabled { opacity: 0.5; cursor: default; }
        .hint { font-size: 12px; color: #52606d; margin-bottom: 10px; }
    </style>
</head>
<body>
    <p class="hint">Build your equation, then press Insert to add it to the document at your
        cursor (Docs) or onto the current slide (Slides).</p>

    <div id="equation-editor" class="CCEqnEditor">
        <div class="CCEditorBar"><div id="cc-history" class="CCHistory"></div></div>
        <div id="cc-toolbar"></div>
        <div id="cc-latex-input" class="CCLatexInput" autocorrect="off" placeholder="Write LaTeX here..."></div>
        <div id="cc-mathview" class="CCMathViewHost"></div>
        <div id="cc-toggle" class="CCViewToggle">
            <label class="cc-switch" title="Show or hide the LaTeX markup above the equation">
                <input type="checkbox" data-latex-toggle>
                <span class="cc-switch-track"><span class="cc-switch-knob"></span></span>
                <span class="cc-switch-label">LaTeX markup</span>
            </label>
        </div>
        <div class="CCEqnOutput"><img id="cc-output" alt=""></div>
    </div>

    <div class="cc-actions">
        <button id="insert-btn" disabled>Insert</button>
    </div>
    <div id="status"></div>

    <script>
        var eqOutput, eqTextArea, eqMathView, eqToolbar;
        var design = {};   // the add-on's EQNEDITOR_DESIGN script property, from getConfig()
        var renderUrl = 'https://latex.codecogs.com';

        function setStatus(text, ok) {
            var el = document.getElementById('status');
            el.textContent = text || '';
            el.className = ok ? 'ok' : '';
        }

        // EqEditor.init() switches the converter every TextArea/MathView/Toolbar construction
        // takes on to fxTeX Pro - skip it and they keep the placeholder converter for the whole
        // sidebar's lifetime, even once eqneditor.api.min.js itself has loaded. Called once,
        // right after the script loads; an empty licence is the normal, expected state until a
        // real one is configured.
        function ensureInit(licence) {
            return (typeof EqEditor.init === 'function')
                ? EqEditor.init({licence: licence || ''}).catch(function (err) {
                    window.console && console.warn('fxTeX Pro: ' + (err && err.message || err));
                })
                : Promise.resolve();
        }

        function loadScript(url) {
            return new Promise(function (resolve, reject) {
                var script = document.createElement('script');
                script.src = url;
                script.onload = function () { resolve(); };
                script.onerror = function () { reject(new Error('Could not load ' + url)); };
                document.head.appendChild(script);
            });
        }

        // A bare host means https; a full origin (e.g. http://localhost:8010 for local development) is used as it is.
        function serverOrigin(host) {
            return /^https?:\/\//.test(host) ? host.replace(/\/+$/, '') : 'https://' + host;
        }

        function loadCss(url) {
            var link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = url;
            document.head.appendChild(link);
        }

        var latexCookieMatch = document.cookie.match(/(?:^|; )cc_eqneditor_show_latex=([^;]*)/);
        var showLatex = latexCookieMatch ? latexCookieMatch[1] === '1' : false;

        function setShowLatexPreference(visible) {
            document.cookie = 'cc_eqneditor_show_latex=' + (visible ? '1' : '0') + '; path=/; max-age=31536000; SameSite=Lax';
        }

        function applyLatexVisible(visible) {
            showLatex = visible;
            setShowLatexPreference(visible);

            var root = document.getElementById('equation-editor');
            if (root) root.setAttribute('data-latex', visible ? 'on' : 'off');

            var box = document.querySelector('#cc-toggle input[data-latex-toggle]');
            if (box) box.checked = visible;

            if (eqToolbar && !visible) eqToolbar.setActiveTextArea(eqMathView || eqTextArea);
        }

        // The `design` option (see the README): how the editor looks, set by the site rather than the
        // author. The toolbar's rows and scale go to Toolbar.link() itself; everything else is applied
        // here, once the editor is mounted - CSS scoped to this editor's root, then the starting state of
        // the LaTeX toggle and the "Insert as" menu.
        var designCount = 0;
        function applyDesign(root, design, latexToggle, insertSelect) {
            if (!root || !design) return;
            if (!root.id) root.id = 'cc-eqn-design-' + (++designCount);
            var sel = '#' + root.id, css = '';
            var colour = String(design.colour || '');
            if (/^(#[0-9a-f]{3,8}|[a-z]+)$/i.test(colour)) {
                css += sel + ' { --cc-accent: ' + colour + ';' +
                    ' --cc-accent-soft: color-mix(in srgb, ' + colour + ' 11%, #fff);' +
                    ' --cc-accent-soft-ring: color-mix(in srgb, ' + colour + ' 28%, #fff);' +
                    ' --cc-accent-mid: color-mix(in srgb, ' + colour + ' 22%, #fff);' +
                    ' --cc-accent-mid-ring: color-mix(in srgb, ' + colour + ' 43%, #fff); }';
            }
            if (Number(design.mathSize) > 0) css += sel + ' .CCMathView { font-size: ' + Number(design.mathSize) + 'px !important; }';
            if (Number(design.latexSize) > 0) css += sel + ' .CCLatexInput { font-size: ' + Number(design.latexSize) + 'px !important; }';
            if (design.toolbar === false) css += sel + ' .CCToolbar { display: none !important; }';
            if (design.history === false) css += sel + ' .CCEditorBar { display: none !important; }';
            if (css) {
                var style = document.createElement('style');
                style.textContent = css;
                root.appendChild(style);
            }
            if (insertSelect && design.insertAs && insertSelect.querySelector('option[value="' + design.insertAs + '"]')) {
                insertSelect.value = design.insertAs;
            }
            if (latexToggle && design.latex && !latexToggle.checked && !latexToggle.disabled) {
                latexToggle.checked = true;
                latexToggle.dispatchEvent(new Event('change', { bubbles: true }));
            }
        }

        // Re-asserts the API's own .CCMathView/.fxtex rules, which host resets and revert-layer override.
        function apiMathRules() {
            var out = '';
            for ( var i = 0; i < document.styleSheets.length; i++ ) {
                var rules;
                try { rules = document.styleSheets[ i ].cssRules; } catch ( e ) { continue; }
                for ( var j = 0; j < rules.length; j++ ) {
                    var r = rules[ j ], decls = '';
                    if ( !r.selectorText || !/(^|,)\s*\.(fxtex|CCMathView)\b/.test( r.selectorText ) ) continue;
                    for ( var k = 0; k < r.style.length; k++ ) {
                        decls += r.style[ k ] + ':' + r.style.getPropertyValue( r.style[ k ] ) + ' !important;';
                    }
                    if ( decls ) {
                        out += r.selectorText.split( ',' ).map( function ( s ) {
                            s = s.trim();
                            return /^\.CCMathView\b/.test( s ) ? s : '.CCMathView ' + s;
                        } ).join( ',' ) + '{' + decls + '}';
                    }
                }
            }
            return out;
        }

        function mount(server) {
            loadCss(serverOrigin(server) + '/eqneditor.css');

            // Roughly 50% taller than the shared eqneditor.css's own default for either view.
            // Also redeclares "Latin Modern Math" with a real url() fallback: the API's own
            // injected @font-face only carries local("Latin Modern Math"), which silently falls
            // back to a generic serif unless that exact font happens to be installed. A later
            // @font-face for the same family replaces the API's src list rather than merging
            // with it, so this fixes every equation and symbol in the sidebar.
            var sizeStyle = document.createElement('style');
            sizeStyle.textContent =
                '@font-face { font-family: "Latin Modern Math"; font-display: swap; ' +
                    'src: local("Latin Modern Math"), ' +
                    'url("' + serverOrigin(server) + '/prototypes/latinmodern-math.otf") format("opentype"); }' +
                // Undo host resets (e.g. .cke_reset_all *) inside the toolbar icons and the maths view's MathML.
                '.CCToolbar svg:has(g[font-family]), .CCToolbar svg:has(g[font-family]) * { font: revert-layer !important; }' +
                // Older API builds draw the icons as plain <text>, fonted by the API's own .cc_panel rule instead.
                '.CCToolbar svg:not(:has(g[font-family])) { font: normal normal 16px "fxTeX Toolbar" !important; }' +
                '.CCToolbar svg:not(:has(g[font-family])) * { font: inherit !important; }' +
                '.CCToolbar svg, .CCToolbar svg * { width: revert-layer !important; height: revert-layer !important; max-width: revert-layer !important; }' +
                '.CCToolbar svg g[font-family="fxTeX Toolbar"] { color: #000 !important; }' +
                '.CCMathView math, .CCMathView math * { font: revert-layer !important; ' +
                    'width: revert-layer !important; height: revert-layer !important; padding: revert-layer !important; ' +
                    'margin: revert-layer !important; text-transform: revert-layer !important; text-align: revert-layer !important; ' +
                    'box-sizing: revert-layer !important; white-space: revert-layer !important; }' +
                apiMathRules() +
                '.CCMathViewHost, .CCLatexInput { min-height: 220px !important; }';
            document.head.appendChild(sizeStyle);

            eqOutput = new EqEditor.Output('cc-output');
            eqOutput.setRenderURL(renderUrl);

            eqTextArea = EqEditor.TextArea.link('cc-latex-input')
                .addOutput(eqOutput)
                .addHistoryMenu(new EqEditor.History('cc-history'));

            eqToolbar = EqEditor.Toolbar.link('cc-toolbar', design.toolbar || 'default', design.toolbarScale || 1).addTextArea(eqTextArea);

            if (typeof EqEditor.MathView !== 'undefined') {
                eqMathView = EqEditor.MathView.link('cc-mathview').addTextArea(eqTextArea);
                eqToolbar.addMathView(eqMathView);
            } else {
                showLatex = true;
            }

            applyLatexVisible(showLatex);

            document.getElementById('cc-toggle').addEventListener('change', function (e) {
                if (e.target.matches('input[data-latex-toggle]')) {
                    applyLatexVisible(e.target.checked);
                }
            });

            applyDesign(document.getElementById('equation-editor'), design,
                document.querySelector('#cc-toggle input[data-latex-toggle]'), null);

            document.getElementById('insert-btn').disabled = false;
        }

        document.getElementById('insert-btn').addEventListener('click', function () {
            var latex = eqTextArea.getTextArea().textContent.trim();
            if (!latex) {
                setStatus('Write an equation first.', false);
                return;
            }

            var url = eqOutput.exportAs('url');
            document.getElementById('insert-btn').disabled = true;
            setStatus('Inserting...', true);

            google.script.run
                .withSuccessHandler(function (result) {
                    document.getElementById('insert-btn').disabled = false;
                    setStatus(result.message, result.ok);
                })
                .withFailureHandler(function (err) {
                    document.getElementById('insert-btn').disabled = false;
                    setStatus('Could not insert the equation: ' + err.message, false);
                })
                .insertEquation(url);
        });

        google.script.run
            .withSuccessHandler(function (config) {
                renderUrl = config.renderUrl;
                design = config.design || {};
                loadScript(serverOrigin(config.server) + '/eqneditor.api.min.js')
                    .then(function () { return ensureInit(config.licence); })
                    .then(function () { mount(config.server); })
                    .catch(function (err) { setStatus(err.message, false); });
            })
            .withFailureHandler(function (err) {
                setStatus('Could not load configuration: ' + err.message, false);
            })
            .getConfig();
    </script>
</body>
</html>
