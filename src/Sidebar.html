<!--
  Sidebar UI for the LaTeX Equation Editor - fxEditor Docs/Slides add-on.

  Runs inside Apps Script's HtmlService sandbox (IFRAME mode, the modern default), which is an
  ordinary iframe with a google.script.run bridge injected - external <script>/<link> tags load
  normally, the same as any other page, which is what lets this embed the same EqEditor UI
  every other adapter in this repo does rather than a cut-down textarea.
-->
<!DOCTYPE html>
<html>
<head>
    <base target="_top">
    <meta charset="utf-8">
    <style>
        /* A column the height of the sidebar, so the predictor at the bottom takes what is left. */
        html, body { height: 100%; }
        body { font-family: Arial, sans-serif; margin: 0; padding: 12px; color: #1c2530;
            box-sizing: border-box; display: flex; flex-direction: column; }
        #status { min-height: 18px; font-size: 12px; color: #b3261e; margin: 8px 0; }
        #status.ok { color: #2c7a4b; }
        .cc-actions { display: flex; gap: 8px; margin-top: 10px; }
        .cc-actions button {
            flex: 1; padding: 8px 12px; border-radius: 4px; border: 1px solid #cbd5e0;
            background: #fff; cursor: pointer; font-size: 13px;
        }
        #insert-btn { background: #2c7a4b; border-color: #2c7a4b; color: #fff; }
        #insert-btn:disabled { opacity: 0.5; cursor: default; }
        .hint { font-size: 12px; color: #52606d; margin-bottom: 10px; }
        /* No rendered preview under the editor - the maths view is the equation, as in the other
           plugins. The <img> stays: EqEditor.Output binds to it, and Insert takes its URL. */
        .CCEqnOutput { display: none !important; }
        /* The toolbar's size, at the right of the undo/redo bar. */
        /* One line however narrow the sidebar gets (a scrollbar takes some of it): the slider gives way. */
        #equation-editor .CCEditorBar, #equation-editor .CCHistory { flex-wrap: nowrap; }
        .cc-toolbar-size { display: inline-flex; align-items: center; gap: 4px; margin-left: auto; min-width: 0;
            flex: 0 1 auto; font-size: 11px; color: #54647c; cursor: pointer; }
        .cc-toolbar-size input { width: 72px; min-width: 36px; flex: 0 1 72px; margin: 0; accent-color: var(--cc-accent, #003794); }
        .cc-toolbar-size output { min-width: 3em; text-align: right; }
        /* The equation in the middle of its box, top to bottom as well as across. */
        #cc-mathview { display: flex !important; align-items: center; justify-content: center; overflow: auto; }
        .CCEqnEditor[data-inline="on"] #cc-mathview { justify-content: flex-start; }
        /* A grip under each pane drags it taller or shorter (arrow keys too) - the LaTeX markup's only
           while it is showing. */
        .CCEqnEditor:not([data-latex="on"]) #cc-grow-latex { display: none; }
        .cc-grow { height: 10px; position: relative; cursor: row-resize; touch-action: none; outline: none; }
        .cc-grow::before { content: ""; position: absolute; top: 3px; left: 42%; right: 42%; height: 3px;
            border-radius: 2px; background: #cbd5e0; }
        .cc-grow:hover::before, .cc-grow:focus-visible::before, .cc-grow.is-dragging::before {
            left: 0; right: 0; background: var(--cc-accent, #003794); }
        #cc-toggle { gap: 14px; flex-wrap: wrap; }
        /* The equation as it goes into the document - its size, colour and background - just above Insert. */
        .cc-style { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin-top: 10px;
            font-size: 11px; color: #54647c; }
        .cc-style label { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
        .cc-style-size { flex: 1 1 100%; }
        .cc-style-size input { flex: 1 1 auto; min-width: 0; margin: 0; accent-color: var(--cc-accent, #003794); }
        .cc-style-size output { min-width: 3.2em; text-align: right; }
        .cc-style-colour input { width: 26px; height: 20px; padding: 0; border: 1px solid #cbd5e0; border-radius: 3px;
            background: none; cursor: pointer; }
        .cc-bg-none { padding: 2px 8px; font: inherit; border: 1px solid #cbd5e0; border-radius: 3px; background: #fff;
            color: #54647c; cursor: pointer; }
        .cc-bg-none[aria-pressed="true"] { border-color: var(--cc-accent, #003794); color: var(--cc-accent, #003794); font-weight: 600; }
        .cc-style.no-background #cc-eq-bg { opacity: 0.35; }
        /* The predictor, at the bottom: whatever height the sidebar has left, scrolling within it. */
        .cc-predictor { flex: 1 1 auto; min-height: 140px; overflow: auto; margin-top: 4px;
            padding-top: 8px; border-top: 1px solid #e2e8f0; }
        .cc-predictor[hidden] { display: none; }
    </style>
</head>
<body>
    <p class="hint">Build your equation, then press Insert to add it to the document at your
        cursor (Docs) or onto the current slide (Slides).</p>

    <div id="equation-editor" class="CCEqnEditor">
        <div class="CCEditorBar">
            <div id="cc-history" class="CCHistory"></div>
            <label class="cc-toolbar-size" title="The toolbar's size">
                <input type="range" id="cc-toolbar-size" min="50" max="120" step="5" value="100" aria-label="Toolbar size">
                <output id="cc-toolbar-size-value" for="cc-toolbar-size">100%</output>
            </label>
        </div>
        <div id="cc-toolbar"></div>
        <div id="cc-latex-input" class="CCLatexInput" autocorrect="off" placeholder="Write LaTeX here..."></div>
        <div id="cc-grow-latex" class="cc-grow" data-pane="latex" role="separator" aria-orientation="horizontal" tabindex="0"
            aria-label="Resize the LaTeX markup" title="Drag to make the LaTeX markup taller or shorter"></div>
        <div id="cc-mathview" class="CCMathViewHost"></div>
        <div id="cc-grow" class="cc-grow" data-pane="math" role="separator" aria-orientation="horizontal" tabindex="0"
            aria-label="Resize the equation" title="Drag to make the equation's box taller or shorter"></div>
        <div id="cc-toggle" class="CCViewToggle">
            <label class="cc-switch" title="An inline equation, set to sit in a line of text">
                <input type="checkbox" data-inline-toggle>
                <span class="cc-switch-track"><span class="cc-switch-knob"></span></span>
                <span class="cc-switch-label">Inline</span>
            </label>
            <label class="cc-switch" title="Show the LaTeX markup in place of the equation">
                <input type="checkbox" data-latex-toggle>
                <span class="cc-switch-track"><span class="cc-switch-knob"></span></span>
                <span class="cc-switch-label">LaTeX</span>
            </label>
            <label class="cc-switch" title="Suggested equations, at the bottom of the sidebar, as you write">
                <input type="checkbox" data-predictor-toggle>
                <span class="cc-switch-track"><span class="cc-switch-knob"></span></span>
                <span class="cc-switch-label">Predictor</span>
            </label>
        </div>
        <div class="CCEqnOutput" hidden><img id="cc-output" alt=""></div>
    </div>

    <div id="cc-style" class="cc-style">
        <label class="cc-style-size" title="The equation's size in the document, in points">
            <span>Size</span>
            <input type="range" id="cc-eq-size" min="8" max="48" step="1" value="11">
            <output id="cc-eq-size-value" for="cc-eq-size">11pt</output>
        </label>
        <label class="cc-style-colour" title="The equation's colour">
            <span>Colour</span>
            <input type="color" id="cc-eq-fg" value="#000000">
        </label>
        <label class="cc-style-colour" title="A background behind the equation">
            <span>Background</span>
            <input type="color" id="cc-eq-bg" value="#ffffff">
        </label>
        <button type="button" id="cc-eq-bg-none" class="cc-bg-none" title="No background: transparent">None</button>
    </div>

    <div class="cc-actions">
        <button id="insert-btn" disabled>Insert</button>
    </div>
    <div id="status"></div>
    <aside id="cc-predictor" class="cc-predictor" aria-label="Suggested equations" hidden></aside>

    <script>
        var eqOutput, eqTextArea, eqMathView, eqToolbar;
        // An equation at Docs' own body size (EQUATION_PT) is rendered at three times screen resolution
        // and inserted at 96/EQUATION_DPI of its pixels: sharp zoomed in or printed, the usual size on
        // the page. A larger size is rendered at a proportionally higher resolution, so stays as sharp.
        var EQUATION_DPI = 288, EQUATION_PT = 11, EQUATION_PT_MIN = 8, EQUATION_PT_MAX = 48;
        var design = {};   // the add-on's EQNEDITOR_DESIGN script property, from getConfig()
        var renderUrl = 'https://latex.codecogs.com';

        function setStatus(text, ok) {
            var el = document.getElementById('status');
            el.textContent = text || '';
            el.className = ok ? 'ok' : '';
        }

        // EqEditor.init() switches the converter every TextArea/MathView/Toolbar construction
        // takes on to fxTeX Pro - skip it and they keep the placeholder converter for the whole
        // sidebar's lifetime, even once fxeditor.api.min.js itself has loaded. Called once,
        // right after the script loads; an empty licence is the normal, expected state until a
        // real one is configured.
        function ensureInit(licence) {
            return (typeof EqEditor.init === 'function')
                ? EqEditor.init({licence: licence || ''}).catch(function (err) {
                    window.console && console.warn('fxTeX Pro: ' + (err && err.message || err));
                })
                : Promise.resolve();
        }

        function loadScript(url) {
            return new Promise(function (resolve, reject) {
                var script = document.createElement('script');
                script.src = url;
                script.onload = function () { resolve(); };
                script.onerror = function () { reject(new Error('Could not load ' + url)); };
                document.head.appendChild(script);
            });
        }

        // A bare host means https; a full origin (e.g. http://localhost:8010 for local development) is used as it is.
        function serverOrigin(host) {
            return /^https?:\/\//.test(host) ? host.replace(/\/+$/, '') : 'https://' + host;
        }

        function loadCss(url) {
            var link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = url;
            document.head.appendChild(link);
        }

        // The author's own settings, kept in this browser: Inline, LaTeX and Predictor, the toolbar's
        // size and each pane's height. localStorage rather than a cookie - nothing here is for
        // a server. The LaTeX switch used to be a cookie, which still seeds it the first time.
        var PREFS_KEY = 'cc-eqn-google';
        var prefs = {};
        try { prefs = JSON.parse(localStorage.getItem(PREFS_KEY)) || {}; } catch (e) {}
        function savePrefs() {
            try { localStorage.setItem(PREFS_KEY, JSON.stringify(prefs)); } catch (e) {}
        }

        var latexCookieMatch = document.cookie.match(/(?:^|; )cc_eqneditor_show_latex=([^;]*)/);
        var showLatex = typeof prefs.latex === 'boolean' ? prefs.latex : (latexCookieMatch ? latexCookieMatch[1] === '1' : false);

        function setShowLatexPreference(visible) {
            prefs.latex = visible;
            savePrefs();
        }

        function applyLatexVisible(visible) {
            showLatex = visible;
            setShowLatexPreference(visible);

            var root = document.getElementById('equation-editor');
            if (root) root.setAttribute('data-latex', visible ? 'on' : 'off');

            var box = document.querySelector('#cc-toggle input[data-latex-toggle]');
            if (box) box.checked = visible;

            if (eqToolbar && !visible) eqToolbar.setActiveTextArea(eqMathView || eqTextArea);
        }

        // The equation's size in the document, in points - see EQUATION_DPI.
        function applyEquationSize(pt) {
            pt = Math.round(Math.min(EQUATION_PT_MAX, Math.max(EQUATION_PT_MIN, Number(pt) || EQUATION_PT)));
            prefs.size = pt;
            document.getElementById('cc-eq-size').value = pt;
            document.getElementById('cc-eq-size-value').textContent = pt + 'pt';
        }
        // Its colour and background: on the image the service draws, and on the maths view, so the
        // author sees roughly what will go in. Black and no background are the service's own defaults,
        // so they are sent as nothing.
        function applyColours() {
            var fg = prefs.fg && prefs.fg !== '#000000' ? prefs.fg : '';
            var bg = prefs.bg || '';
            if (typeof eqOutput.setForeground === 'function') eqOutput.setForeground(fg);
            if (typeof eqOutput.setBackground === 'function') eqOutput.setBackground(bg);
            document.getElementById('cc-eq-fg').value = prefs.fg || '#000000';
            if (bg) document.getElementById('cc-eq-bg').value = bg;
            document.getElementById('cc-style').classList.toggle('no-background', !bg);
            document.getElementById('cc-eq-bg-none').setAttribute('aria-pressed', bg ? 'false' : 'true');
            var view = document.querySelector('#cc-mathview .CCMathView');
            if (view) {
                view.style.color = fg;
                view.style.background = bg;
            }
        }
        function watchStyle() {
            var size = document.getElementById('cc-eq-size');
            size.addEventListener('input', function () { applyEquationSize(size.value); });
            size.addEventListener('change', savePrefs);
            document.getElementById('cc-eq-fg').addEventListener('input', function (e) {
                prefs.fg = e.target.value; applyColours(); savePrefs();
            });
            document.getElementById('cc-eq-bg').addEventListener('input', function (e) {
                prefs.bg = e.target.value; applyColours(); savePrefs();
            });
            document.getElementById('cc-eq-bg-none').addEventListener('click', function () {
                prefs.bg = ''; applyColours(); savePrefs();
            });
            // Neither colour control can be set or seen without the API's colour support.
            if (typeof eqOutput.setForeground !== 'function') {
                document.querySelectorAll('.cc-style-colour, #cc-eq-bg-none').forEach(function (el) { el.hidden = true; });
            }
        }

        // An inline equation: the maths view and the inserted image both set as in a line of text.
        function applyInline(on) {
            prefs.inline = on;
            document.getElementById('equation-editor').setAttribute('data-inline', on ? 'on' : 'off');
            document.querySelector('#cc-toggle input[data-inline-toggle]').checked = on;
            if (eqMathView) eqMathView.setInline(on);
            if (eqOutput) eqOutput.setInline(on);
        }

        // The predictor - whole equations that start the way this one does - at the bottom of the
        // sidebar. Built the first time it is switched on, so nothing is asked of the suggestion
        // service while it is off.
        var predictorView = null;
        function applyPredictor(on) {
            var box = document.querySelector('#cc-toggle input[data-predictor-toggle]');
            if (typeof EqEditor.PredictorView === 'undefined') {   // an API from before the predictor
                box.closest('.cc-switch').hidden = true;
                return;
            }
            prefs.predictor = on;
            box.checked = on;
            document.getElementById('cc-predictor').hidden = !on;
            if (on && !predictorView) {
                var show = design.predictorShow === 'latex' || design.predictorShow === 'both' ? design.predictorShow : 'mathml';
                predictorView = EqEditor.PredictorView.link('cc-predictor', { limit: 8, show: show }).addTextArea(eqTextArea);
                if (eqMathView) predictorView.addMathView(eqMathView);
            }
        }

        // The toolbar's size, 50-120%, on top of design.toolbarScale. zoom scales it as it stands, so
        // nothing is rebuilt: the toolbar keeps which pane it is typing into, and any open panel.
        function applyToolbarSize(pct) {
            pct = Math.min(120, Math.max(50, Math.round(Number(pct) / 5) * 5 || 100));
            prefs.toolbarSize = pct;
            document.getElementById('cc-toolbar').style.zoom = String(pct / 100);
            document.getElementById('cc-toolbar-size').value = pct;
            document.getElementById('cc-toolbar-size-value').textContent = pct + '%';
        }

        // Each pane's own height - the maths view's and the LaTeX markup's, which show together when
        // LaTeX is on - dragged on the grip below it, or set with that grip's arrow keys.
        var PANE = {
            math: { id: 'cc-mathview', pref: 'mathHeight', initial: 220 },
            latex: { id: 'cc-latex-input', pref: 'latexHeight', initial: 120 }
        };
        var PANE_MIN = 60, PANE_MAX = 700;
        var heightStyle = null;
        function applyPaneHeight(pane, h) {
            var p = PANE[pane];
            prefs[p.pref] = Math.round(Math.min(PANE_MAX, Math.max(PANE_MIN, Number(h) || p.initial)));
            if (!heightStyle) {
                heightStyle = document.createElement('style');
                document.head.appendChild(heightStyle);
            }
            heightStyle.textContent = Object.keys(PANE).map(function (k) {
                var q = PANE[k];
                return '#' + q.id + ' { height: ' + (prefs[q.pref] || q.initial) + 'px !important; ' +
                    'min-height: 0 !important; box-sizing: border-box !important; resize: none !important; }';
            }).join('');
        }
        function watchGrips() {
            document.querySelectorAll('.cc-grow[data-pane]').forEach(watchGrip);
        }
        function watchGrip(grip) {
            var pane = grip.getAttribute('data-pane'), pref = PANE[pane].pref;
            grip.addEventListener('keydown', function (e) {
                if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
                e.preventDefault();
                applyPaneHeight(pane, prefs[pref] + (e.key === 'ArrowDown' ? 20 : -20));
                savePrefs();
            });
            grip.addEventListener('pointerdown', function (e) {
                if (e.button !== 0) return;
                e.preventDefault();
                var startY = e.clientY, startH = prefs[pref];
                grip.setPointerCapture(e.pointerId);
                grip.classList.add('is-dragging');
                function move(ev) { applyPaneHeight(pane, startH + ev.clientY - startY); }
                function up() {
                    grip.removeEventListener('pointermove', move);
                    grip.removeEventListener('pointerup', up);
                    grip.removeEventListener('pointercancel', up);
                    grip.classList.remove('is-dragging');
                    savePrefs();
                }
                grip.addEventListener('pointermove', move);
                grip.addEventListener('pointerup', up);
                grip.addEventListener('pointercancel', up);
            });
        }

        // The `design` option (see the README): how the editor looks, set by the site rather than the
        // author. The toolbar's rows and scale go to Toolbar.link() itself; everything else is applied
        // here, once the editor is mounted - CSS scoped to this editor's root, then the starting state of
        // the LaTeX toggle and the "Insert as" menu.
        var designCount = 0;
        function applyDesign(root, design, latexToggle, insertSelect) {
            if (!root || !design) return;
            if (!root.id) root.id = 'cc-eqn-design-' + (++designCount);
            var sel = '#' + root.id, css = '';
            var colour = String(design.colour || '');
            if (/^(#[0-9a-f]{3,8}|[a-z]+)$/i.test(colour)) {
                css += sel + ' { --cc-accent: ' + colour + ';' +
                    ' --cc-accent-soft: color-mix(in srgb, ' + colour + ' 11%, #fff);' +
                    ' --cc-accent-soft-ring: color-mix(in srgb, ' + colour + ' 28%, #fff);' +
                    ' --cc-accent-mid: color-mix(in srgb, ' + colour + ' 22%, #fff);' +
                    ' --cc-accent-mid-ring: color-mix(in srgb, ' + colour + ' 43%, #fff); }';
            }
            if (Number(design.mathSize) > 0) css += sel + ' .CCMathView { font-size: ' + Number(design.mathSize) + 'px !important; }';
            if (Number(design.latexSize) > 0) css += sel + ' .CCLatexInput { font-size: ' + Number(design.latexSize) + 'px !important; }';
            if (design.toolbar === false) css += sel + ' .CCToolbar { display: none !important; }';
            if (design.history === false) css += sel + ' .CCEditorBar { display: none !important; }';
            if (css) {
                var style = document.createElement('style');
                style.textContent = css;
                root.appendChild(style);
            }
            // The dialog's width and height (`width`, `height`), before any scaling: the box takes the width,
            // and the editing area whatever height makes the whole dialog the height asked for - measured,
            // since everything else in it (toolbar rows, the bottom bar) varies with the design. Hosts that
            // size their dialogs themselves (TinyMCE 4, CKEditor 4) are given both when they open it instead.
            var sizedBox = root.closest( '.tox-dialog, .mce-window, .cke_dialog, .ck-balloon-panel, .cc-eqneditor-modal, .tc-drop-down' ) || root;
            if ( !sizedBox.matches( '.mce-window, .cke_dialog' ) ) {
                if ( Number( design.width ) > 0 ) sizedBox.style.setProperty( 'width', Number( design.width ) + 'px', 'important' );
                var area = root.querySelector( '.CCMathViewHost' );
                if ( Number( design.height ) > 0 && area ) {
                    // Measured, then measured again as the dialog settles - the toolbar fits itself to its row
                    // after the dialog first lays out, and the fonts arrive - correcting by the difference each time.
                    // A box with a height of its own (Froala's and Tiptap's modals) sizes to its contents instead.
                    sizedBox.style.setProperty( 'height', 'auto', 'important' );
                    var sizing = document.createElement( 'style' );
                    root.appendChild( sizing );
                    var h = 0;
                    var fit = function () {
                        var shown = root.querySelector( '.CCLatexInput' ) && getComputedStyle( area ).display === 'none'
                            ? root.querySelector( '.CCLatexInput' ) : area;
                        // Scale may already be applied (see below), and on-screen sizes include it.
                        var applied = parseFloat( sizedBox.style.zoom ) || parseFloat( ( sizedBox.style.transform.match( /scale\(([\d.]+)\)/ ) || [] )[ 1 ] ) || 1;
                        var now = h || shown.getBoundingClientRect().height / applied;
                        h = Math.max( 120, Math.round( now + Number( design.height ) - sizedBox.getBoundingClientRect().height / applied ) );
                        // Never taller than the whole dialog asked for: a host that caps its dialog (and scrolls the
                        // rest) would otherwise be chased upwards on every pass.
                        h = Math.min( h, Number( design.height ) );
                        sizing.textContent = '#' + root.id + ' { height: auto !important; } #' + root.id + ' .CCMathViewHost, #' + root.id + ' .CCLatexInput { height: ' + h + 'px !important; min-height: ' + h + 'px !important; }';
                    };
                    fit();
                    [ 150, 500, 1200 ].forEach( function ( t ) { setTimeout( fit, t ); } );
                }
            }
            // The whole dialog, box and contents together - see `dialogSize` in the README. Zoomed where
            // the host lays the dialog out (it grows in place); scaled where the host positions it itself
            // (CKEditor, TinyMCE 4, a TiddlyWiki drop-down), so that placement still holds.
            var size = Number( design.dialogSize );
            if ( size > 0 && size !== 1 ) {
                var box = root.closest( '.tox-dialog, .mce-window, .cke_dialog, .ck-balloon-panel, .cc-eqneditor-modal, .tc-drop-down' ) || root;
                var position = getComputedStyle( box ).position;
                if ( position === 'absolute' || position === 'fixed' ) {
                    box.style.transform = 'scale(' + size + ')';
                    box.style.transformOrigin = box.matches( '.ck-balloon-panel' ) ? 'top center'
                        : box.matches( '.tc-drop-down' ) ? 'top left' : 'center center';
                    // A cap on the box's width (CKEditor 5's balloon: 96vw) holds before the scale - divided by it,
                    // as for zoom below, or a scaled-down box is squeezed narrower than its own contents.
                    box.style.removeProperty( 'max-width' );   // a host that reuses the box (CKEditor 5) would otherwise divide it again
                    var cap = getComputedStyle( box ).maxWidth;
                    if ( cap !== 'none' ) box.style.setProperty( 'max-width', 'calc(' + cap + ' / ' + size + ')', 'important' );
                } else {
                    box.style.zoom = String( size );
                    box.style.setProperty( 'max-width', 'calc(96vw / ' + size + ')', 'important' );   // still no wider than the window
                }
            }
            if (insertSelect && design.insertAs && insertSelect.querySelector('option[value="' + design.insertAs + '"]')) {
                insertSelect.value = design.insertAs;
            }
            if (latexToggle && design.latex && !latexToggle.checked && !latexToggle.disabled) {
                latexToggle.checked = true;
                latexToggle.dispatchEvent(new Event('change', { bubbles: true }));
            }
        }

        // Re-asserts the API's own .CCMathView/.fxtex rules, which host resets and revert-layer override.
        function apiMathRules() {
            var out = '';
            for ( var i = 0; i < document.styleSheets.length; i++ ) {
                var rules;
                try { rules = document.styleSheets[ i ].cssRules; } catch ( e ) { continue; }
                for ( var j = 0; j < rules.length; j++ ) {
                    var r = rules[ j ], decls = '';
                    if ( !r.selectorText || !/(^|,)\s*(:where\(\.fxEditor\)\s*)?\.(fxtex|CCMathView)\b/.test( r.selectorText ) ) continue;
                    for ( var k = 0; k < r.style.length; k++ ) {
                        decls += r.style[ k ] + ':' + r.style.getPropertyValue( r.style[ k ] ) + ' !important;';
                    }
                    if ( decls ) {
                        out += r.selectorText.replace( /:where\(\.fxEditor\)\s*/g, '' ).split( ',' ).map( function ( s ) {
                            s = s.trim();
                            return /^\.CCMathView\b/.test( s ) ? s : '.CCMathView ' + s;
                        } ).join( ',' ) + '{' + decls + '}';
                    }
                }
            }
            return out;
        }

        function mount(server) {
            loadCss(serverOrigin(server) + '/fxeditor.css');

            // Roughly 50% taller than the shared fxeditor.css's own default for either view.
            // Also redeclares "Latin Modern Math" with a real url() fallback: the API's own
            // injected @font-face only carries local("Latin Modern Math"), which silently falls
            // back to a generic serif unless that exact font happens to be installed. A later
            // @font-face for the same family replaces the API's src list rather than merging
            // with it, so this fixes every equation and symbol in the sidebar.
            var sizeStyle = document.createElement('style');
            sizeStyle.textContent =
                '@font-face { font-family: "Latin Modern Math"; font-display: swap; ' +
                    'src: local("Latin Modern Math"), ' +
                    'url("' + serverOrigin(server) + '/fonts/LatinModernMath-Regular.woff2") format("woff2"), url("' + serverOrigin(server) + '/prototypes/latinmodern-math.otf") format("opentype"); }' +
                // Undo host resets (e.g. .cke_reset_all *) inside the toolbar icons and the maths view's MathML.
                '.CCToolbar svg:has(g[font-family]), .CCToolbar svg:has(g[font-family]) * { font: revert-layer !important; }' +
                // Icons drawn as <text>: the svg gets the API's own .cc_panel font (fxTeX Toolbar, 16px) back over host resets, and each <text> its own font-size attribute (revert-layer lets attributes win).
                '.CCToolbar svg:not(:has(g[font-family])) { font: normal normal 16px "fxTeX Toolbar" !important; }' +
                '.CCToolbar svg:not(:has(g[font-family])) * { font: revert-layer !important; }' +
                '.CCToolbar svg, .CCToolbar svg * { width: revert-layer !important; height: revert-layer !important; max-width: revert-layer !important; }' +
                '.CCToolbar svg g[font-family="fxTeX Toolbar"] { color: #000 !important; }' +
                '.CCMathView math, .CCMathView math * { font: revert-layer !important; ' +
                    'width: revert-layer !important; height: revert-layer !important; padding: revert-layer !important; ' +
                    'margin: revert-layer !important; text-transform: revert-layer !important; text-align: revert-layer !important; ' +
                    'box-sizing: revert-layer !important; white-space: revert-layer !important; }' +
                apiMathRules();
            document.head.appendChild(sizeStyle);

            eqOutput = new EqEditor.Output('cc-output');
            eqOutput.setRenderURL(renderUrl);
            // A PNG: all Docs and Slides take - they refuse SVG (see insertEquation() in Code.gs).
            // At EQUATION_DPI, for the server to insert at 96/EQUATION_DPI of its size.
            eqOutput.setFormat('png');
            if (typeof eqOutput.setDpi === 'function') eqOutput.setDpi(EQUATION_DPI);

            eqTextArea = EqEditor.TextArea.link('cc-latex-input')
                .addOutput(eqOutput)
                .addHistoryMenu(new EqEditor.History('cc-history'));

            eqToolbar = EqEditor.Toolbar.link('cc-toolbar', design.toolbar || 'default', design.toolbarScale || 1).addTextArea(eqTextArea);

            if (typeof EqEditor.MathView !== 'undefined') {
                eqMathView = EqEditor.MathView.link('cc-mathview').addTextArea(eqTextArea);
                eqToolbar.addMathView(eqMathView);
            } else {
                showLatex = true;
            }

            applyLatexVisible(showLatex);
            applyInline(prefs.inline === true);
            applyPredictor(prefs.predictor !== false);
            applyToolbarSize(prefs.toolbarSize || 100);
            applyEquationSize(prefs.size);
            applyColours();
            watchStyle();
            // A height saved before the panes had one each (prefs.height) was the maths view's.
            applyPaneHeight('math', prefs.mathHeight || prefs.height);
            applyPaneHeight('latex', prefs.latexHeight);
            delete prefs.height;

            document.getElementById('cc-toggle').addEventListener('change', function (e) {
                if (e.target.matches('input[data-latex-toggle]')) applyLatexVisible(e.target.checked);
                if (e.target.matches('input[data-inline-toggle]')) { applyInline(e.target.checked); savePrefs(); }
                if (e.target.matches('input[data-predictor-toggle]')) { applyPredictor(e.target.checked); savePrefs(); }
            });
            var sizeInput = document.getElementById('cc-toolbar-size');
            sizeInput.addEventListener('input', function () { applyToolbarSize(Number(sizeInput.value)); });
            sizeInput.addEventListener('change', savePrefs);
            watchGrips();

            applyDesign(document.getElementById('equation-editor'), design,
                document.querySelector('#cc-toggle input[data-latex-toggle]'), null);

            document.getElementById('insert-btn').disabled = false;
        }

        document.getElementById('insert-btn').addEventListener('click', function () {
            var latex = eqTextArea.getTextArea().textContent.trim();
            if (!latex) {
                setStatus('Write an equation first.', false);
                return;
            }

            // getEquationURL() since fxeditor-api replaced exportAs() (its 9630657); exportAs() for
            // an API from before that.
            // Rendered at the resolution its size asks for - see EQUATION_DPI.
            if (typeof eqOutput.setDpi === 'function') eqOutput.setDpi(Math.round(EQUATION_DPI * prefs.size / EQUATION_PT));
            var url = typeof eqOutput.getEquationURL === 'function' ? eqOutput.getEquationURL() : eqOutput.exportAs('url');
            document.getElementById('insert-btn').disabled = true;
            setStatus('Inserting...', true);

            google.script.run
                .withSuccessHandler(function (result) {
                    document.getElementById('insert-btn').disabled = false;
                    setStatus(result.message, result.ok);
                })
                .withFailureHandler(function (err) {
                    document.getElementById('insert-btn').disabled = false;
                    setStatus('Could not insert the equation: ' + err.message, false);
                })
                .insertEquation(url, latex, typeof eqOutput.setDpi === 'function' ? EQUATION_DPI : 0);
        });

        google.script.run
            .withSuccessHandler(function (config) {
                renderUrl = config.renderUrl;
                design = config.design || {};
                loadScript(serverOrigin(config.server) + '/fxeditor.api.min.js')
                    .then(function () { return ensureInit(config.licence); })
                    .then(function () { mount(config.server); })
                    .catch(function (err) { setStatus(err.message, false); });
            })
            .withFailureHandler(function (err) {
                setStatus('Could not load configuration: ' + err.message, false);
            })
            .getConfig();
    </script>
</body>
</html>
