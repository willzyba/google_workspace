<!DOCTYPE html>
<!--
  A preview of the Google Docs/Slides add-on outside Google: the add-on's own sidebar
  (src/Sidebar.html, unchanged) beside a stand-in document. Apps Script's google.script.run
  bridge is replaced by a stub that answers getConfig() the way Code.gs does from its script
  properties (EQNEDITOR_SERVER, EQNEDITOR_LICENCE, EQNEDITOR_DESIGN, EQNEDITOR_RENDER_URL), and
  that puts the equation into the stand-in document instead of calling insertEquation() in Code.gs.

  The sidebar is mounted into this page rather than a frame of its own: fxTeX Pro checks the
  licence against the page's address, and a frame written from here would have none.

  In Google Workspace itself, push src/ with clasp and set those script properties - see
  README.md. Replace the licence with your own fxTeX Pro licence key (fx_pk_...), from
  fxeditor.codecogs.com/purchase.
-->
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LaTeX Equation Editor - fxEditor - Google Docs add-on preview</title>
    <style>
        body { margin: 0; background: #f1f3f4; font-family: Arial, sans-serif; color: #1c2530; }
        .app { display: flex; gap: 16px; padding: 16px; height: 100vh; box-sizing: border-box; }
        .doc { flex: 1; min-width: 0; overflow: auto; background: #fff; padding: 48px 56px;
               box-shadow: 0 1px 3px rgba(0,0,0,.15); }
        .doc img { vertical-align: middle; margin: 4px 0; }
        .sidebar { flex: 0 0 300px; display: flex; flex-direction: column; background: #fff;
                   box-shadow: 0 1px 3px rgba(0,0,0,.15); overflow: auto; }
        .sidebar-title { padding: 12px 16px; font-size: 16px; border-bottom: 1px solid #dadce0; }
    </style>
</head>
<body>
    <div class="app">
        <div class="doc" id="doc">
            <!-- sample -->
            <p>Sample text and an equation:</p>
            <p><img src="https://fxtex.codecogs.com/png.image?\dpi{110}\sum_{i=0}^{n}a_i^2&plus;b"
                    alt="\sum_{i=0}^{n}a_i^2+b"></p>
            <p>Build an equation in the sidebar, then press Insert.</p>
            <!-- /sample -->
        </div>
        <div class="sidebar">
            <div class="sidebar-title">LaTeX Equation Editor</div>
            <div id="sidebar"></div>
        </div>
    </div>

    <script>
        // What Code.gs does, for this page: getConfig() from the script properties, and
        // insertEquation() putting the rendered image at the end of the document.
        var backend = {
            getConfig: function () {
                return {
                    server: '{{EQN_SERVER}}',
                    renderUrl: 'https://fxtex.codecogs.com',
                    licence: '{{FXTEXPRO_KEY}}'
                };
            },
            insertEquation: function ( url ) {
                var p = document.createElement( 'p' );
                var img = document.createElement( 'img' );
                img.src = url;
                p.appendChild( img );
                document.getElementById( 'doc' ).appendChild( p );
                return { ok: true, message: 'Equation inserted.' };
            }
        };

        // google.script.run, as the sidebar sees it: withSuccessHandler()/withFailureHandler()
        // chain, and calling a server function answers asynchronously.
        function scriptRun( onSuccess, onFailure ) {
            return new Proxy( {}, {
                get: function ( target, name ) {
                    if ( name === 'withSuccessHandler' ) return function ( fn ) { return scriptRun( fn, onFailure ); };
                    if ( name === 'withFailureHandler' ) return function ( fn ) { return scriptRun( onSuccess, fn ); };
                    return function () {
                        var args = arguments;
                        setTimeout( function () {
                            try {
                                var result = backend[ name ].apply( null, args );
                                if ( onSuccess ) onSuccess( result );
                            } catch ( err ) {
                                if ( onFailure ) onFailure( err );
                            }
                        }, 50 );
                    };
                }
            } );
        }

        window.google = { script: { run: scriptRun() } };

        // Sidebar.html, into #sidebar: its styles (with "body" meaning the sidebar), its markup,
        // then its scripts - recreated, since scripts parsed from a string never run.
        function mountPage( html, box ) {
            var page = new DOMParser().parseFromString( html, 'text/html' );
            page.querySelectorAll( 'style' ).forEach( function ( st ) {
                var style = document.createElement( 'style' );
                style.textContent = st.textContent.replace( /(^|[},\s])body(?=\s*[{,])/g, '$1#' + box.id );
                document.head.appendChild( style );
            } );
            Array.prototype.slice.call( page.body.childNodes ).forEach( function ( node ) {
                if ( node.nodeName !== 'SCRIPT' ) box.appendChild( document.importNode( node, true ) );
            } );
            page.body.querySelectorAll( 'script' ).forEach( function ( old ) {
                var script = document.createElement( 'script' );
                script.textContent = old.textContent;
                box.appendChild( script );
            } );
        }

        fetch( 'src/Sidebar.html' )
            .then( function ( r ) { return r.text(); } )
            .then( function ( html ) { mountPage( html, document.getElementById( 'sidebar' ) ); } );
    </script>
</body>
</html>
